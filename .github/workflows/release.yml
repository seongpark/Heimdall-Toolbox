name: Build & Release

# main에 푸시하면 앱을 빌드하고, build.sh의 VERSION으로 Release(v<VERSION>)를 만듭니다.
# 새 버전을 내려면 build.sh의 VERSION만 올려서 푸시하세요.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "build.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (arm64)
          - runner: macos-15-intel    # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.runner }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^VERSION=' build.sh | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Heimdall Toolbox v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.zip
          overwrite_files: true
          body: |
            macOS용 Heimdall Toolbox — Heimdall(Odin 플래시) + ADB(APK 설치·사이드로드·파일 전송) 올인원 앱

            - `HeimdallToolbox-arm64.zip`: Apple Silicon (M1 이상)
            - `HeimdallToolbox-x86_64.zip`: Intel 맥

            압축을 풀고 앱을 **우클릭 → 열기**로 처음 실행하세요. 막히면 터미널에서
            `xattr -cr "/Applications/Heimdall Toolbox.app"`
